name: Myelin browser port
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            myelin -> target
      - name: Build and verify
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          ./scripts/build-myelin.sh
          cargo test --locked --features openstrike --lib
          node tests/native.mjs
